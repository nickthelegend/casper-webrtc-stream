    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-problem", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 2, ease: "power2.inOut" }, 20.2);
        tl.fromTo("#el-03-code", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 2, ease: "power2.inOut" }, 20.2);
        tl.to("#el-05-yield", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 49.7);
        tl.fromTo("#el-06-bridge", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 49.7);
        tl.to("#el-08-stack", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 80.1);
        tl.fromTo("#el-09-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 80.1);
        tl.to({}, { duration: 90 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
