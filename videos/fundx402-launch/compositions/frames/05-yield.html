    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=block");
      #root {

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="05-yield"]');
        const q = (s) => root.querySelector(s);
        const tl = gsap.timeline({ paused: true });
        const wd = q(".f5-wd");
        const v = { n: 2000000 };
        const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        tl.fromTo(q(".f5-kick"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
        tl.fromTo(q(".f5-num:not(.f5-wd)"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7);
        tl.fromTo(q(".f5-arrow"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
        tl.fromTo(q(".f5-wd"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.4);
        tl.to(q(".f5-base"), { width: "93%", duration: 0.8, ease: "power2.out" }, 1.6);

        // compounds — number climbs + yield bar + 2.5% badge (~4.5s VO)
        tl.to(v, { n: 2050000, duration: 1.1, ease: "power2.out", onUpdate() { if (wd) wd.textContent = fmt(v.n); } }, 4.2);
        tl.to(q(".f5-yield"), { width: "7%", duration: 0.7, ease: "power2.out" }, 4.4);
        tl.fromTo(q(".f5-badge"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 4.8);
        tl.fromTo(q(".f5-sub"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.2);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-yield"] = tl;
      })();
    </script>
