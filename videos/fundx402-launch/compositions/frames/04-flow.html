    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=block");

    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="04-flow"]');
        const q = (s) => root.querySelector(s);
        const tl = gsap.timeline({ paused: true });
        const litBorder = "1px solid rgba(34,224,166,0.55)";
        const dim = "1px solid #1c1f26";

        tl.fromTo(q(".f4-head"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        tl.fromTo(q(".n1"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.7);
        tl.fromTo(q(".n2"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.95);
        tl.fromTo(q(".n3"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.2);
        tl.fromTo(q(".n4"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.45);

        // 1 -> 2 : pool fronts (~3.3s VO)
        tl.to(q(".w-12"), { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 3.0);
        tl.fromTo(q(".w-12 .f4-pulse"), { opacity: 1, x: 0 }, { x: 90, duration: 0.5, ease: "power1.in" }, 3.1);
        tl.set(q(".w-12 .f4-pulse"), { opacity: 0 }, 3.6);
        tl.fromTo(q(".n2"), { borderColor: "#1c1f26" }, { borderColor: "rgba(34,224,166,0.55)", duration: 0.3 }, 3.6);
        tl.fromTo(q(".f4-v2"), { color: "#9a9fb0" }, { color: "#22e0a6", duration: 0.3 }, 3.6);

        // 2 -> 3 : settle on Casper (~6s VO)
        tl.to(q(".n2"), { borderColor: "#1c1f26", duration: 0.4 }, 4.8);
        tl.to(q(".f4-v2"), { color: "#9a9fb0", duration: 0.4 }, 4.8);
        tl.to(q(".w-23"), { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 5.2);
        tl.fromTo(q(".w-23 .f4-pulse"), { opacity: 1, x: 0 }, { x: 90, duration: 0.5, ease: "power1.in" }, 5.3);
        tl.set(q(".w-23 .f4-pulse"), { opacity: 0 }, 5.8);
        tl.call(() => { const e = q(".f4-settle"); if (e) { e.textContent = "✓ processed"; e.classList.add("done"); } }, null, 5.9);
        tl.to(q(".f4-dep"), { opacity: 1, duration: 0.4 }, 6.2);

        // 3 -> 4 : 200 OK (~8.5s VO)
        tl.to(q(".w-34"), { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 7.4);
        tl.fromTo(q(".w-34 .f4-pulse"), { opacity: 1, x: 0 }, { x: 90, duration: 0.5, ease: "power1.in" }, 7.5);
        tl.set(q(".w-34 .f4-pulse"), { opacity: 0 }, 8.0);
        tl.call(() => { q(".f4-200").classList.add("lit"); }, null, 8.1);
        tl.fromTo(q(".f4-200"), { scale: 1.18 }, { scale: 1, duration: 0.4, ease: "power3.out", transformOrigin: "left center" }, 8.1);

        // receipt — "every hash is real" (~10s VO)
        tl.fromTo(q(".f4-receipt"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-flow"] = tl;
      })();
    </script>

</template>
