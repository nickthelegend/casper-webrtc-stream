    <script>
      (function () {
        const root = document.querySelector('[data-composition-id="08-stack"]');
        const q = (s) => root.querySelector(s);
        const qa = (s) => root.querySelectorAll(s);
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(q(".f8-head"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo(q(".f8-spine"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.7);

        // chips reveal + light mint one at a time as the VO names them (~1.4s..5.5s)
        const chips = qa(".f8-chip");
        const cues = [1.4, 2.3, 3.2, 4.1, 5.0];
        chips.forEach((c, i) => {
          tl.fromTo(c, { opacity: 0, y: 22, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, cues[i]);
          const ic = c.querySelector(".f8-ic");
          // transient mint as it's named, then settle back to ink (one accent at a time)
          tl.to(ic, { color: "#22e0a6", duration: 0.2 }, cues[i] + 0.1);
          tl.to(ic, { color: "#8a8fa0", duration: 0.5 }, cues[i] + 0.7);
        });

        tl.fromTo(q(".f8-npm"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.7);
        tl.fromTo(q(".f8-foot"), { opacity: 0 }, { opacity: 1, duration: 0.45 }, 6.2);

        window.__timelines = window.__timelines || {};
        window.__timelines["08-stack"] = tl;
