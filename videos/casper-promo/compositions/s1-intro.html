<template id="s1-intro-template">
  <div
    data-composition-id="s1-intro"
    data-width="1920"
    data-height="1080"
    data-duration="6"
  >
    <div class="canvas">
      <!-- Ambient background layers -->
      <div class="bg-base"></div>
      <div class="bg-grid"></div>
      <div class="bg-glow"></div>

      <!-- Centered lockup -->
      <div class="lockup">
        <div class="mono-wrap">
          <div class="mono-ring"></div>
          <div class="monogram"><span class="mono-num">402</span></div>
        </div>

        <div class="wordmark-wrap">
          <h1 class="wordmark">casper-webrtc-stream</h1>
          <div class="underline"></div>
        </div>

        <div class="kicker">x402 micropayments · settled on Casper</div>
      </div>
    </div>

    <style>
      @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      [data-composition-id="s1-intro"] .canvas {
        width: 1920px;
        height: 1080px;
        background-color: #070a10;
        position: relative;
        overflow: hidden;
      }

      [data-composition-id="s1-intro"] .bg-base {
        position: absolute;
        inset: 0;
        background-color: #070a10;
      }

      [data-composition-id="s1-intro"] .bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(139, 152, 171, 0.05) 1px, transparent 1px);
        background-size: 26px 26px;
      }

      [data-composition-id="s1-intro"] .bg-glow {
        position: absolute;
        inset: -10%;
        background: radial-gradient(600px 400px at 20% 15%, rgba(139, 108, 255, 0.18), transparent 60%);
        transform-origin: center center;
        will-change: transform;
      }

      /* Centered lockup: monogram above wordmark */
      [data-composition-id="s1-intro"] .lockup {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 1680px;
        text-align: center;
      }

      [data-composition-id="s1-intro"] .mono-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="s1-intro"] .monogram {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b6cff, #5b8cff);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 18px 50px rgba(139, 108, 255, 0.45),
          0 0 90px rgba(139, 108, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
        will-change: transform;
      }

      [data-composition-id="s1-intro"] .mono-num {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }

      [data-composition-id="s1-intro"] .mono-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 88px;
        height: 88px;
        margin: -44px 0 0 -44px;
        border-radius: 26px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform-origin: center center;
        opacity: 0;
        pointer-events: none;
      }

      [data-composition-id="s1-intro"] .wordmark-wrap {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }

      [data-composition-id="s1-intro"] .wordmark {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 92px;
        line-height: 1.0;
        letter-spacing: -0.02em;
        color: #eaf0f8;
        margin: 0;
        white-space: nowrap;
        /* clip wipe reveal, left-to-right */
        clip-path: inset(0 100% 0 0);
        will-change: clip-path;
      }

      [data-composition-id="s1-intro"] .underline {
        margin-top: 26px;
        width: 100%;
        height: 2px;
        background: #8b6cff;
        border-radius: 2px;
        box-shadow: 0 0 14px rgba(139, 108, 255, 0.6);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
      }

      [data-composition-id="s1-intro"] .kicker {
        margin-top: 40px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b98ab;
        opacity: 0;
        will-change: transform, opacity;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const Q = (s) => '[data-composition-id="s1-intro"] ' + s;

        const canvas = Q(".canvas");
        const glow = Q(".bg-glow");
        const lockup = Q(".lockup");
        const monogram = Q(".monogram");
        const ring = Q(".mono-ring");
        const wordmark = Q(".wordmark");
        const underline = Q(".underline");
        const kicker = Q(".kicker");

        // --- Initial states ---
        tl.set(canvas, { opacity: 0 });
        tl.set(lockup, { y: 14 });
        tl.set(monogram, { scale: 0, rotation: -8 });
        tl.set(ring, { scale: 0.65, opacity: 0 });
        tl.set(wordmark, { clipPath: "inset(0 100% 0 0)", y: 10, opacity: 0 });
        tl.set(underline, { scaleX: 0 });
        tl.set(kicker, { y: 16, opacity: 0 });
        tl.set(glow, { xPercent: 0, yPercent: 0, scale: 1, opacity: 1 });

        // --- Scene fade IN (first ~0.45s) + gentle lockup settle ---
        tl.to(canvas, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.0);
        tl.to(lockup, { y: 0, duration: 1.2, ease: "power3.out" }, 0.0);

        // --- 1. Monogram springs in (back.out) ---
        tl.to(
          monogram,
          { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" },
          0.18
        );

        // --- Impact ring expands + fades around monogram ---
        tl.fromTo(
          ring,
          { scale: 0.65, opacity: 0.9 },
          { scale: 2.0, opacity: 0, duration: 0.7, ease: "power2.out" },
          0.5
        );

        // --- 2. Wordmark reveals via clip wipe, left-to-right ---
        tl.to(wordmark, { opacity: 1, duration: 0.01 }, 0.95);
        tl.to(
          wordmark,
          { clipPath: "inset(0 0% 0 0)", y: 0, duration: 0.95, ease: "expo.inOut" },
          0.95
        );

        // --- 3. Hairline violet underline draws in ---
        tl.to(
          underline,
          { scaleX: 1, duration: 0.85, ease: "power3.out" },
          1.45
        );

        // --- 4. Mono kicker fades up ---
        tl.to(
          kicker,
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          1.85
        );

        // --- 5. Settle: slow continuous drift of the violet glow ---
        tl.to(
          glow,
          { xPercent: 7, yPercent: 5, scale: 1.08, duration: 3.6, ease: "sine.inOut" },
          1.6
        );

        // gentle breathing on the monogram during the hold
        tl.to(
          monogram,
          { scale: 1.015, duration: 1.7, ease: "sine.inOut" },
          2.4
        );
        tl.to(
          monogram,
          { scale: 1.0, duration: 1.6, ease: "sine.inOut" },
          4.1
        );

        // --- Scene fade OUT (last ~0.4s) so it cross-dissolves with neighbors ---
        tl.to(canvas, { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["s1-intro"] = tl;
      })();
    </script>
  </div>
</template>
