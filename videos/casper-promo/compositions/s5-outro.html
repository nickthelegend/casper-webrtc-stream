<template id="s5-outro-template">
  <div
    data-composition-id="s5-outro"
    data-width="1920"
    data-height="1080"
    data-duration="6"
  >
    <div class="canvas">
      <!-- Background layers -->
      <div class="dot-grid"></div>
      <div class="violet-glow"></div>

      <!-- Centered lockup -->
      <div class="lockup">
        <!-- Monogram tile -->
        <div class="monogram-wrap">
          <div class="monogram-ring"></div>
          <div class="monogram">
            <span class="monogram-num">402</span>
          </div>
        </div>

        <!-- Wordmark -->
        <div class="wordmark">casper-webrtc-stream</div>

        <!-- Install pill -->
        <div class="install-pill">
          <span class="install-cmd"
            ><span class="muted">npm i </span><span class="pkg">@nickthelegend69/webrtc-payment-sdk-core</span></span
          ><span class="caret"></span>
        </div>

        <!-- Tagline -->
        <div class="tagline">
          The payment rail for the agent economy — on Casper
        </div>
      </div>

      <!-- Bottom chips -->
      <div class="chips">
        <span class="chip">npm</span>
        <span class="chip-dot">·</span>
        <span class="chip">Casper testnet</span>
        <span class="chip-dot">·</span>
        <span class="chip">x402</span>
      </div>

      <!-- Final fade-to-black veil -->
      <div class="fade-veil"></div>
    </div>

    <style>
      @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      [data-composition-id="s5-outro"] .canvas {
        width: 1920px;
        height: 1080px;
        background: #070a10;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }

      /* Faint dot-grid */
      [data-composition-id="s5-outro"] .dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(139, 152, 171, 0.085) 1.2px,
          transparent 1.2px
        );
        background-size: 38px 38px;
        background-position: center center;
        opacity: 0;
        z-index: 1;
      }

      /* Soft violet radial glow, center */
      [data-composition-id="s5-outro"] .violet-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1500px;
        height: 1500px;
        transform: translate(-50%, -50%) scale(0.85);
        background: radial-gradient(
          circle,
          rgba(139, 108, 255, 0.22) 0%,
          rgba(139, 108, 255, 0.08) 32%,
          rgba(7, 10, 16, 0) 62%
        );
        opacity: 0;
        pointer-events: none;
        z-index: 1;
      }

      [data-composition-id="s5-outro"] .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 1680px; /* within ~120px safe margins */
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 3;
      }

      /* Monogram */
      [data-composition-id="s5-outro"] .monogram-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 38px;
      }

      [data-composition-id="s5-outro"] .monogram-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 88px;
        height: 88px;
        transform: translate(-50%, -50%) scale(1);
        border-radius: 26px;
        border: 2px solid rgba(139, 108, 255, 0.85);
        opacity: 0;
        pointer-events: none;
      }

      [data-composition-id="s5-outro"] .monogram {
        position: absolute;
        left: 0;
        top: 0;
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b6cff, #5b8cff);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 18px 48px rgba(139, 108, 255, 0.45),
          0 6px 18px rgba(91, 140, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.4);
        transform-origin: center center;
      }

      [data-composition-id="s5-outro"] .monogram-num {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        color: #ffffff;
        letter-spacing: -0.5px;
      }

      /* Wordmark */
      [data-composition-id="s5-outro"] .wordmark {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 600;
        font-size: 84px;
        line-height: 1.04;
        color: #eaf0f8;
        letter-spacing: -1.5px;
        text-align: center;
        opacity: 0;
        margin-bottom: 40px;
      }

      /* Install pill */
      [data-composition-id="s5-outro"] .install-pill {
        display: inline-flex;
        align-items: center;
        background: #0d121c;
        border: 1px solid rgba(139, 152, 171, 0.18);
        border-radius: 12px;
        padding: 14px 22px;
        opacity: 0;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
      }

      [data-composition-id="s5-outro"] .install-cmd {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 26px;
        line-height: 1.5;
        white-space: nowrap;
        /* clip reveal */
        display: inline-block;
        overflow: hidden;
        clip-path: inset(0 100% 0 0);
      }

      [data-composition-id="s5-outro"] .install-cmd .muted {
        color: #8b98ab;
      }

      [data-composition-id="s5-outro"] .install-cmd .pkg {
        color: #eaf0f8;
      }

      [data-composition-id="s5-outro"] .caret {
        display: inline-block;
        width: 2px;
        height: 28px;
        margin-left: 8px;
        background: #8b6cff;
        opacity: 0;
        transform: translateY(2px);
      }

      /* Tagline */
      [data-composition-id="s5-outro"] .tagline {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-size: 28px;
        font-weight: 400;
        color: #8b98ab;
        letter-spacing: 0.2px;
        text-align: center;
        opacity: 0;
        margin-top: 40px;
      }

      /* Bottom chips */
      [data-composition-id="s5-outro"] .chips {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        opacity: 0;
        z-index: 3;
      }

      [data-composition-id="s5-outro"] .chip {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 16px;
        color: #6f7d90;
        letter-spacing: 0.5px;
      }

      [data-composition-id="s5-outro"] .chip-dot {
        font-family: "JetBrains Mono", Menlo, monospace;
        font-size: 16px;
        color: #4a5567;
      }

      /* Final fade veil */
      [data-composition-id="s5-outro"] .fade-veil {
        position: absolute;
        inset: 0;
        background: #04060a;
        opacity: 0;
        pointer-events: none;
        z-index: 9;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const id = '[data-composition-id="s5-outro"]';
        const dotGrid = id + " .dot-grid";
        const glow = id + " .violet-glow";
        const monogram = id + " .monogram";
        const ring = id + " .monogram-ring";
        const wordmark = id + " .wordmark";
        const pill = id + " .install-pill";
        const cmd = id + " .install-cmd";
        const caret = id + " .caret";
        const tagline = id + " .tagline";
        const chips = id + " .chips";
        const veil = id + " .fade-veil";

        // === Beat 0: world fades in (0 .. ~0.5s) ===
        tl.to(dotGrid, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
        tl.fromTo(
          glow,
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
          0,
        );

        // === Beat 1: monogram springs in + ring pulse (~0.3 .. 1.2s) ===
        tl.fromTo(
          monogram,
          { opacity: 0, scale: 0.4, y: 8 },
          { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "back.out(1.2)" },
          0.3,
        );
        // ring pulse outward as monogram lands
        tl.fromTo(
          ring,
          { opacity: 0.9, scale: 1 },
          { opacity: 0, scale: 2.1, duration: 0.95, ease: "expo.out" },
          0.55,
        );

        // === Beat 2: wordmark rises in (~1.0 .. 2.2s) ===
        tl.fromTo(
          wordmark,
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" },
          1.05,
        );

        // === Beat 3: install pill reveals; caret resolves (~2.2 .. 3.2s) ===
        tl.fromTo(
          pill,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          2.2,
        );
        // clip-path wipe reveal of the command text
        tl.fromTo(
          cmd,
          { clipPath: "inset(0 100% 0 0)" },
          {
            clipPath: "inset(0 0% 0 0)",
            duration: 0.85,
            ease: "expo.inOut",
          },
          2.45,
        );
        // caret appears mid-reveal, blinks, then resolves (fades out)
        tl.to(caret, { opacity: 1, duration: 0.12, ease: "none" }, 2.5);
        tl.to(
          caret,
          { opacity: 0.15, duration: 0.32, ease: "power1.inOut", yoyo: true, repeat: 3 },
          2.62,
        );
        tl.to(caret, { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.45);

        // === Beat 4: tagline fades up (~3.2 .. 4.2s) ===
        tl.fromTo(
          tagline,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.95, ease: "power3.out" },
          3.25,
        );
        // chips quietly join near the bottom
        tl.fromTo(
          chips,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          3.7,
        );

        // === Beat 5: gentle breathing + glow swell (~4.2 .. 5.3s) ===
        tl.to(
          glow,
          { scale: 1.12, opacity: 1, duration: 1.1, ease: "sine.inOut" },
          4.2,
        );
        tl.to(
          monogram,
          { scale: 1.035, duration: 1.1, ease: "sine.inOut" },
          4.2,
        );
        tl.to(
          monogram,
          { scale: 1, duration: 0.8, ease: "sine.inOut" },
          5.3,
        );

        // === Beat 6: fade everything to near-black, clean end (~5.3 .. 6s) ===
        tl.to(
          [monogram, wordmark, pill, tagline, chips, glow, dotGrid],
          { opacity: 0, duration: 0.7, ease: "power2.inOut" },
          5.3,
        );
        tl.to(
          veil,
          { opacity: 1, duration: 0.7, ease: "power2.inOut" },
          5.32,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["s5-outro"] = tl;
      })();
    </script>
  </div>
</template>
