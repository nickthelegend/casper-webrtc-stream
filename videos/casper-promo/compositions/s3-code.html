<template id="s3-code-template">
  <div
    data-composition-id="s3-code"
    data-width="1920"
    data-height="1080"
    data-duration="15"
  >
    <div class="canvas">
      <div class="dot-grid"></div>

      <!-- Kicker -->
      <div class="kicker">DROP IT INTO ANY APP</div>

      <!-- Card A: server.ts (LEFT) -->
      <div class="code-card card-a">
        <div class="chrome">
          <span class="dot dot-r"></span>
          <span class="dot dot-y"></span>
          <span class="dot dot-g"></span>
          <span class="filename">server.ts</span>
        </div>
        <div class="code-body">
          <div class="code-line line-a1"><span class="ln">1</span><span class="code-text"></span></div>
          <div class="code-line line-a2"><span class="ln">2</span><span class="code-text"></span></div>
          <div class="code-line line-a3"><span class="ln">3</span><span class="code-text"></span></div>
          <div class="code-line line-a4"><span class="ln">4</span><span class="code-text"></span></div>
          <div class="code-line line-a5"><span class="ln">5</span><span class="code-text"></span></div>
          <div class="code-line line-a6"><span class="ln">6</span><span class="code-text"></span></div>
          <div class="code-line line-a7"><span class="ln">7</span><span class="code-text"></span></div>
          <!-- highlight sweep over the paymentMiddleware export -->
          <div class="highlight-sweep sweep-a"></div>
        </div>
      </div>

      <!-- Card B: client.ts (RIGHT) -->
      <div class="code-card card-b">
        <div class="chrome">
          <span class="dot dot-r"></span>
          <span class="dot dot-y"></span>
          <span class="dot dot-g"></span>
          <span class="filename">client.ts</span>
        </div>
        <div class="code-body">
          <div class="code-line line-b1"><span class="ln">1</span><span class="code-text"></span></div>
          <div class="code-line line-b2"><span class="ln">2</span><span class="code-text"></span></div>
          <div class="code-line line-b3"><span class="ln">3</span><span class="code-text"></span></div>
          <div class="code-line line-b4"><span class="ln">4</span><span class="code-text"></span></div>
          <div class="code-line line-b5"><span class="ln">5</span><span class="code-text"></span></div>
          <div class="code-line line-b6"><span class="ln">6</span><span class="code-text"></span></div>
          <div class="code-line line-b7">
            <span class="ln">7</span>
            <span class="code-text comment-host">
              <span class="comment comment-402">// 402 payment required</span>
              <span class="comment comment-200">// 200 OK</span>
            </span>
          </div>
          <!-- highlight sweep over the wrapFetch export -->
          <div class="highlight-sweep sweep-b"></div>
        </div>
      </div>

      <!-- Bottom caption-free label -->
      <div class="summary-label">server + client &middot; one line each</div>
    </div>

    <style>
      @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      [data-composition-id="s3-code"] .canvas {
        width: 1920px;
        height: 1080px;
        background-color: #070a10;
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #eaf0f8;
      }

      [data-composition-id="s3-code"] .dot-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(rgba(139, 152, 171, 0.12) 1px, transparent 1px);
        background-size: 34px 34px;
        opacity: 0.6;
      }

      [data-composition-id="s3-code"] .kicker {
        position: absolute;
        top: 104px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "JetBrains Mono", "Space Grotesk", monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.42em;
        color: #8b98ab;
        text-transform: uppercase;
        opacity: 0;
      }

      [data-composition-id="s3-code"] .code-card {
        position: absolute;
        top: 268px;
        width: 840px;
        background: #0d121c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        opacity: 0;
        transform-origin: center center;
      }

      [data-composition-id="s3-code"] .card-a {
        left: 110px;
      }

      [data-composition-id="s3-code"] .card-b {
        left: 970px;
      }

      [data-composition-id="s3-code"] .chrome {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.015);
      }

      [data-composition-id="s3-code"] .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        margin-right: 9px;
        opacity: 0.55;
      }
      [data-composition-id="s3-code"] .dot-r {
        background: #ff5f57;
      }
      [data-composition-id="s3-code"] .dot-y {
        background: #febc2e;
      }
      [data-composition-id="s3-code"] .dot-g {
        background: #28c840;
      }

      [data-composition-id="s3-code"] .filename {
        margin-left: 16px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-weight: 400;
        color: #8b98ab;
        letter-spacing: 0.01em;
      }

      [data-composition-id="s3-code"] .code-body {
        position: relative;
        padding: 30px 40px 32px 36px;
      }

      [data-composition-id="s3-code"] .code-line {
        display: flex;
        align-items: baseline;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.55;
        min-height: 34px;
        white-space: pre;
      }

      [data-composition-id="s3-code"] .ln {
        display: inline-block;
        width: 26px;
        flex: 0 0 26px;
        color: #5b6b80;
        font-size: 16px;
        user-select: none;
        text-align: right;
        margin-right: 20px;
      }

      [data-composition-id="s3-code"] .code-text {
        position: relative;
        white-space: pre;
      }

      /* syntax token colors (set on injected spans) */
      [data-composition-id="s3-code"] .tok-kw {
        color: #8b6cff;
      }
      [data-composition-id="s3-code"] .tok-fn {
        color: #8b6cff;
      }
      /* hero: the SDK package strings POP in green with a soft glow */
      [data-composition-id="s3-code"] .tok-pkg {
        color: #2ee6a6;
        text-shadow:
          0 0 10px rgba(46, 230, 166, 0.55),
          0 0 22px rgba(46, 230, 166, 0.3);
      }
      [data-composition-id="s3-code"] .tok-str {
        color: #ffc24b;
      }
      [data-composition-id="s3-code"] .tok-com {
        color: #5b6b80;
      }
      [data-composition-id="s3-code"] .tok-pn {
        color: #eaf0f8;
      }
      /* named exports — violet, carry an underline/glow sweep on reveal */
      [data-composition-id="s3-code"] .tok-exp {
        color: #b9a6ff;
        font-weight: 500;
      }

      /* caret */
      [data-composition-id="s3-code"] .caret {
        display: inline-block;
        width: 2px;
        height: 22px;
        margin-left: 1px;
        background: #8b6cff;
        transform: translateY(4px);
        opacity: 0;
      }

      /* highlight sweep underline/glow under a token */
      [data-composition-id="s3-code"] .highlight-sweep {
        position: absolute;
        height: 32px;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          rgba(139, 108, 255, 0) 0%,
          rgba(139, 108, 255, 0.22) 18%,
          rgba(139, 108, 255, 0.22) 82%,
          rgba(139, 108, 255, 0) 100%
        );
        box-shadow: 0 0 26px rgba(139, 108, 255, 0.45);
        border-bottom: 2px solid #8b6cff;
        opacity: 0;
        pointer-events: none;
        transform-origin: left center;
      }

      /* sweep sits under "paymentMiddleware" — line 4, col offset for indent */
      [data-composition-id="s3-code"] .sweep-a {
        top: 130px;
        left: 86px;
        width: 224px;
      }

      /* sweep sits under "wrapFetch" — line 1 export */
      [data-composition-id="s3-code"] .sweep-b {
        top: 28px;
        left: 165px;
        width: 122px;
      }

      /* comment cross-fade hosts */
      [data-composition-id="s3-code"] .comment-host {
        position: relative;
        display: inline-block;
      }

      [data-composition-id="s3-code"] .comment {
        position: absolute;
        left: 0;
        top: 0;
        white-space: pre;
      }

      [data-composition-id="s3-code"] .comment-402 {
        color: #ff453a;
        opacity: 0;
      }

      [data-composition-id="s3-code"] .comment-200 {
        color: #2ee6a6;
        text-shadow: 0 0 10px rgba(46, 230, 166, 0.45);
        opacity: 0;
      }

      /* bottom summary label */
      [data-composition-id="s3-code"] .summary-label {
        position: absolute;
        bottom: 96px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #8b98ab;
        opacity: 0;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const ROOT = '[data-composition-id="s3-code"]';
        const q = (sel) => document.querySelector(ROOT + " " + sel);

        const tl = gsap.timeline({ paused: true });

        // ---- Syntax highlighting helper -------------------------------------
        // Each "line" is described as an array of [text, tokenClass] segments.
        // We render progressively for a typewriter feel: a {val} object is
        // tweened from 0..totalChars and onUpdate rewrites the visible prefix.
        function fullText(segments) {
          return segments.map((s) => s[0]).join("");
        }

        // Render the first `n` characters of a segmented line as colored spans.
        function renderPrefix(el, segments, n, withCaret) {
          let remaining = Math.max(0, Math.min(n, fullText(segments).length));
          let html = "";
          for (let i = 0; i < segments.length && remaining > 0; i++) {
            const [text, cls] = segments[i];
            const take = Math.min(text.length, remaining);
            const chunk = text.substring(0, take);
            const safe = chunk
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            html += '<span class="' + cls + '">' + safe + "</span>";
            remaining -= take;
          }
          if (withCaret) html += '<span class="caret">&nbsp;</span>';
          el.innerHTML = html;
        }

        // Build a typewriter tween for one code line. Returns the end time.
        function typeLine(lineSel, segments, startAt, speed) {
          const el = q(lineSel + " .code-text");
          const total = fullText(segments).length;
          const obj = { val: 0 };
          tl.call(
            () => {
              renderPrefix(el, segments, 0, true);
            },
            null,
            startAt
          );
          tl.to(
            obj,
            {
              val: total,
              duration: total / speed,
              ease: "none",
              onUpdate: () => {
                renderPrefix(el, segments, Math.ceil(obj.val), true);
              },
            },
            startAt
          );
          // settle: drop the caret at the end
          tl.call(
            () => {
              renderPrefix(el, segments, total, false);
            },
            null,
            startAt + total / speed
          );
          return startAt + total / speed;
        }

        // ---- Line definitions (segmented for color) -------------------------
        // Card A — server.ts (imports lead; package strings are the hero)
        const a1 = [
          ["import", "tok-kw"],
          [" { ", "tok-pn"],
          ["paymentMiddleware", "tok-exp"],
          [" } ", "tok-pn"],
          ["from", "tok-kw"],
        ];
        const a2 = [
          ['  "@nickthelegend69/webrtc-payment-sdk-core"', "tok-pkg"],
        ];
        const a3 = [
          ["import", "tok-kw"],
          [" { ", "tok-pn"],
          ["CasperX402Rail", "tok-fn"],
          [" } ", "tok-pn"],
          ["from", "tok-kw"],
        ];
        const a4 = [
          ['  "@nickthelegend69/webrtc-payment-rail-x402"', "tok-pkg"],
        ];
        const a5 = [
          ["app", "tok-pn"],
          [".", "tok-pn"],
          ["get", "tok-fn"],
          ["(", "tok-pn"],
          ['"/premium"', "tok-str"],
          [",", "tok-pn"],
        ];
        const a6 = [
          ["  ", "tok-pn"],
          ["paymentMiddleware", "tok-fn"],
          ["({ ", "tok-pn"],
          ["rail", "tok-pn"],
          [", ", "tok-pn"],
          ["amount", "tok-pn"],
          [", ", "tok-pn"],
          ["payTo", "tok-pn"],
          [" }),", "tok-pn"],
        ];
        const a7 = [
          ["  ", "tok-pn"],
          ["handler", "tok-pn"],
          [")", "tok-pn"],
        ];

        // Card B — client.ts (imports lead; package strings are the hero)
        const b1 = [
          ["import", "tok-kw"],
          [" { ", "tok-pn"],
          ["wrapFetch", "tok-exp"],
          [" } ", "tok-pn"],
          ["from", "tok-kw"],
        ];
        const b2 = [
          ['  "@nickthelegend69/webrtc-payment-sdk-core"', "tok-pkg"],
        ];
        const b3 = [
          ["import", "tok-kw"],
          [" { ", "tok-pn"],
          ["CasperX402Rail", "tok-fn"],
          [", ", "tok-pn"],
          ["makeEd25519SignFn", "tok-fn"],
          [" }", "tok-pn"],
        ];
        const b4 = [
          ["  ", "tok-pn"],
          ["from", "tok-kw"],
          [" ", "tok-pn"],
          ['"@nickthelegend69/webrtc-payment-rail-x402"', "tok-pkg"],
        ];
        const b5 = [
          ["const", "tok-kw"],
          [" pay ", "tok-pn"],
          ["= ", "tok-pn"],
          ["wrapFetch", "tok-fn"],
          ["(", "tok-pn"],
          ["fetch", "tok-pn"],
          [", { ", "tok-pn"],
          ["rail", "tok-pn"],
          [", ", "tok-pn"],
          ["signFn", "tok-pn"],
          [" })", "tok-pn"],
        ];
        const b6 = [
          ["const", "tok-kw"],
          [" res ", "tok-pn"],
          ["= ", "tok-pn"],
          ["await", "tok-kw"],
          [" ", "tok-pn"],
          ["pay", "tok-fn"],
          ["(", "tok-pn"],
          ['"/premium"', "tok-str"],
          [")", "tok-pn"],
        ];

        // ---- Initial states -------------------------------------------------
        gsap.set(ROOT + " .code-card", { y: 46, scale: 0.965 });
        gsap.set(ROOT + " .kicker", { y: -14 });
        gsap.set(ROOT + " .summary-label", { y: 12 });
        gsap.set(ROOT + " .highlight-sweep", { scaleX: 0 });
        gsap.set(ROOT + " .comment-200", { y: 6 });

        // =====================================================================
        // BEAT 0 — fade the whole scene up gently (0 .. 0.45s)
        // =====================================================================
        tl.to(ROOT + " .canvas", { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);

        // =====================================================================
        // BEAT 1 — kicker + BOTH card frames spring in side by side (0.5 .. 1.2s)
        // =====================================================================
        tl.to(
          ROOT + " .kicker",
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.45
        );
        tl.to(
          ROOT + " .card-a",
          { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "back.out(1.5)" },
          0.6
        );
        tl.to(
          ROOT + " .card-b",
          { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "back.out(1.5)" },
          0.72
        );

        // =====================================================================
        // BEAT 2 — the IMPORTS reveal/type line-by-line in BOTH cards.
        //          The package strings land with their glow — hero moment.
        //          (1.2 .. 5.5s) — interleave server/client so both build.
        // =====================================================================
        // Server imports
        typeLine(".line-a1", a1, 1.25, 30);
        typeLine(".line-a2", a2, 1.95, 56); // package string — lands with glow
        typeLine(".line-a3", a3, 3.05, 30);
        typeLine(".line-a4", a4, 3.75, 56); // package string — lands with glow

        // Client imports (slightly offset so eyes catch both)
        typeLine(".line-b1", b1, 1.55, 30);
        typeLine(".line-b2", b2, 2.25, 56); // package string — lands with glow
        typeLine(".line-b3", b3, 3.4, 34);
        typeLine(".line-b4", b4, 4.2, 52); // package string — lands with glow

        // =====================================================================
        // BEAT 3 — the USAGE lines reveal, with the paymentMiddleware +
        //          wrapFetch violet highlight sweeps (5.5 .. 9s)
        // =====================================================================
        // Server usage
        typeLine(".line-a5", a5, 5.55, 34);
        typeLine(".line-a6", a6, 6.2, 40);
        typeLine(".line-a7", a7, 7.15, 30);

        // Client usage
        typeLine(".line-b5", b5, 5.85, 40);
        typeLine(".line-b6", b6, 6.95, 38);

        // paymentMiddleware highlight sweep (server, line 6) — fires as it lands
        tl.to(
          ROOT + " .sweep-a",
          { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.out" },
          7.55
        );
        tl.to(
          ROOT + " .sweep-a",
          { boxShadow: "0 0 40px rgba(139,108,255,0.7)", duration: 0.45, ease: "sine.inOut" },
          7.9
        );
        tl.to(
          ROOT + " .sweep-a",
          { boxShadow: "0 0 24px rgba(139,108,255,0.4)", duration: 0.55, ease: "sine.inOut" },
          8.35
        );

        // wrapFetch highlight sweep (client, line 5)
        tl.to(
          ROOT + " .sweep-b",
          { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.out" },
          7.75
        );
        tl.to(
          ROOT + " .sweep-b",
          { boxShadow: "0 0 40px rgba(139,108,255,0.7)", duration: 0.45, ease: "sine.inOut" },
          8.1
        );
        tl.to(
          ROOT + " .sweep-b",
          { boxShadow: "0 0 24px rgba(139,108,255,0.4)", duration: 0.55, ease: "sine.inOut" },
          8.55
        );

        // The 402 comment "types" on (client, line 7) after b6 settles
        tl.set(ROOT + " .comment-402", { opacity: 1 }, 7.85);
        (function typeComment() {
          const el = q(".comment-402");
          const txt = "// 402 payment required";
          const obj = { val: 0 };
          tl.call(
            () => {
              if (el) el.textContent = "";
            },
            null,
            7.85
          );
          tl.to(
            obj,
            {
              val: txt.length,
              duration: txt.length / 44,
              ease: "none",
              onUpdate: () => {
                if (el) el.textContent = txt.substring(0, Math.ceil(obj.val));
              },
            },
            7.85
          );
        })();

        // =====================================================================
        // BEAT 4 — the client's last line 402 (red) cross-dissolves to
        //          200 OK (green) (9 .. 11s)
        // =====================================================================
        tl.to(
          ROOT + " .comment-402",
          { opacity: 0, y: -6, filter: "blur(2px)", duration: 0.6, ease: "power2.in" },
          9.1
        );
        tl.to(
          ROOT + " .comment-200",
          { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
          9.45
        );
        tl.fromTo(
          ROOT + " .comment-200",
          { scale: 0.96 },
          { scale: 1, duration: 0.55, ease: "back.out(2.2)" },
          9.45
        );

        // =====================================================================
        // BEAT 5 — small label fades in centered below the cards (11 .. 13s)
        // =====================================================================
        tl.to(
          ROOT + " .summary-label",
          { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
          11.05
        );
        // both cards drift up a hair together to feel "locked in"
        tl.to(
          ROOT + " .code-card",
          { y: -8, duration: 1.0, ease: "power2.out" },
          11.1
        );

        // =====================================================================
        // BEAT 6 — hold with a faint idle shimmer on the package glow
        //          (13 .. 14.6s)
        // =====================================================================
        tl.to(
          ROOT + " .tok-pkg",
          { textShadow: "0 0 16px rgba(46,230,166,0.8), 0 0 30px rgba(46,230,166,0.45)", duration: 0.8, ease: "sine.inOut" },
          13.0
        );
        tl.to(
          ROOT + " .tok-pkg",
          { textShadow: "0 0 10px rgba(46,230,166,0.55), 0 0 22px rgba(46,230,166,0.3)", duration: 0.9, ease: "sine.inOut" },
          13.8
        );

        // =====================================================================
        // BEAT 7 — fade everything OUT over the last ~0.4s (14.6 .. 15s)
        // =====================================================================
        tl.to(
          ROOT + " .canvas",
          { opacity: 0, duration: 0.4, ease: "power2.in" },
          14.6
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["s3-code"] = tl;
      })();
    </script>
  </div>
</template>
