<template id="s2-flow-template">
  <div
    data-composition-id="s2-flow"
    data-width="1920"
    data-height="1080"
    data-duration="22"
  >
    <div class="canvas">
      <div class="dot-grid"></div>
      <div class="violet-glow"></div>

      <!-- Stage holds all animated content for global fade in/out -->
      <div class="stage">
        <!-- Kicker -->
        <div class="kicker">THE x402 FLOW</div>

        <!-- Request lane (hairline track between client + server) -->
        <div class="lane">
          <div class="lane-track"></div>
        </div>

        <!-- Client node (left) -->
        <div class="node node-client">
          <div class="node-head">
            <span class="node-dot dot-violet"></span>
            <span class="node-title">CLIENT</span>
          </div>
          <div class="node-sub">consumer app</div>
          <div class="node-status" data-status="client">idle</div>
        </div>

        <!-- Server node (right) -->
        <div class="node node-server">
          <div class="node-head">
            <span class="node-dot dot-muted"></span>
            <span class="node-title">SERVER</span>
          </div>
          <div class="node-sub">/premium resource</div>
          <div class="node-status" data-status="server">listening</div>
        </div>

        <!-- Casper / facilitator node (lower center-right) -->
        <div class="node node-casper">
          <div class="node-head">
            <span class="node-dot dot-green"></span>
            <span class="node-title">CASPER</span>
          </div>
          <div class="node-sub">facilitator · settle</div>
        </div>

        <!-- Casper link line (server -> casper) -->
        <div class="casper-link">
          <div class="casper-link-fill"></div>
        </div>

        <!-- Traveling packet (the hero) -->
        <div class="packet">
          <span class="packet-method">GET</span>
          <span class="packet-path">/premium</span>
        </div>

        <!-- 402 badge (server -> client) -->
        <div class="badge badge-402">
          <span class="badge-code">402</span>
          <span class="badge-label">Payment Required</span>
        </div>

        <!-- 200 badge (server -> client) -->
        <div class="badge badge-200">
          <span class="badge-check">&#10003;</span>
          <span class="badge-code">200</span>
          <span class="badge-label">OK</span>
        </div>

        <!-- Requirements card (near client) -->
        <div class="reqs-card">
          <div class="reqs-row">
            <span class="reqs-key">amount</span>
            <span class="reqs-val val-gold">0.10 X402</span>
          </div>
          <div class="reqs-row">
            <span class="reqs-key">payTo</span>
            <span class="reqs-val val-mono">8752&#8230;f39e</span>
          </div>
        </div>

        <!-- Signed chip (near client) -->
        <div class="chip chip-signed">
          <span class="chip-tag">EIP-712</span>
          <span class="chip-text">&#10003; signed</span>
        </div>

        <!-- X-PAYMENT header pill (near client) -->
        <div class="header-pill">X-PAYMENT</div>

        <!-- Casper settlement: tx chip + spinner/check + label -->
        <div class="tx-cluster">
          <div class="tx-chip">
            <span class="tx-spinner"></span>
            <span class="tx-check">&#10003;</span>
            <span class="tx-hash">tx 448eafae&#8230;</span>
          </div>
          <div class="tx-label">settled on-chain</div>
        </div>
      </div>
    </div>

    <style>

@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const ID = '[data-composition-id="s2-flow"]';
        const q = (sel) => ID + " " + sel;

        const tl = gsap.timeline({ paused: true });

        // ---------- Initial states ----------
        gsap.set(q(".node-client"), { x: -60 });
        gsap.set(q(".node-server"), { x: 60 });
        gsap.set(q(".node-casper"), { y: 30 });
        gsap.set(q(".tx-spinner"), { transformOrigin: "center center" });

        // Continuous spinner rotation (decorative, deterministic via timeline scrub).
        // Driven as a tween so it stays seek-safe.

        // ======================================================
        // GLOBAL FADE IN (0 -> 0.5s)
        // ======================================================
        tl.to(q(".stage"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

        // Re-paced to 22s. Tween durations stay natural (packet travel, badge
        // springs, settle); the extra time lives as calm holds BETWEEN beats,
        // filled with subtle idle life (slow node breathing on the active side,
        // a faint lane shimmer, a gentle violet-glow pulse) so nothing feels
        // rushed or empty. Beats keep their original order.

        // ======================================================
        // BEAT 1 (0.6 - 3.6s): nodes spring in, lane draws, packet GET /premium travels client -> server
        // ======================================================
        tl.to(q(".node-client"), { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.6);
        tl.to(q(".node-server"), { opacity: 1, x: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.78);
        tl.to(q(".node-casper"), { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.96);

        tl.to(q(".lane-track"), { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 1.3);

        // Idle: faint glow breath while the diagram settles before the packet flies.
        tl.to(q(".violet-glow"), { opacity: 0.72, duration: 0.9, ease: "sine.inOut" }, 1.4);
        tl.to(q(".violet-glow"), { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 2.3);

        // Packet appears at client side, travels to server.
        // packet left:0; lane spans ~x560..x1360. Client-edge ~540, server-edge ~1190.
        // (Initial label "GET /premium" is already in the markup — no TextPlugin needed.)
        tl.add(setPacketPath("/premium"), 2.0);
        tl.to(q(".packet"), { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.1);
        tl.fromTo(
          q(".packet"),
          { x: 540 },
          { x: 1130, duration: 0.9, ease: "power2.inOut" },
          2.25,
        );
        tl.to(q(".packet"), { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.1);

        // Server reacts
        tl.to(q(".node-server .node-dot"), { backgroundColor: "#ff453a", duration: 0.2 }, 3.18);
        tl.add(setStatus("server", "402"), 3.18);

        // Idle hold (3.4 - 4.2s): server breathes as it answers, lane glints.
        tl.to(q(".node-server"), { scale: 1.018, transformOrigin: "center center", duration: 0.45, ease: "sine.inOut" }, 3.45);
        tl.to(q(".node-server"), { scale: 1, duration: 0.45, ease: "sine.inOut" }, 3.9);
        tl.to(q(".lane-track"), { opacity: 0.7, duration: 0.45, ease: "sine.inOut" }, 3.5);
        tl.to(q(".lane-track"), { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 3.95);

        // ======================================================
        // BEAT 2 (4.2 - 6.6s): 402 travels server -> client; requirements card appears near client
        // ======================================================
        tl.to(q(".badge-402"), { opacity: 1, duration: 0.25, ease: "back.out(1.4)" }, 4.25);
        tl.fromTo(
          q(".badge-402"),
          { x: 0 },
          { x: -1010, duration: 1.0, ease: "power2.inOut" },
          4.35,
        );
        tl.to(q(".badge-402"), { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.3);

        // Client receives 402
        tl.to(q(".node-client .node-dot"), { backgroundColor: "#ff453a", duration: 0.2 }, 5.25);
        tl.add(setStatus("client", "402 received"), 5.25);

        // Requirements card springs in near client
        tl.to(
          q(".reqs-card"),
          { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.3)" },
          5.35,
        );

        // Idle hold (5.9 - 6.7s): client breathes while the requirements register.
        tl.to(q(".node-client"), { scale: 1.018, transformOrigin: "center center", duration: 0.45, ease: "sine.inOut" }, 5.95);
        tl.to(q(".node-client"), { scale: 1, duration: 0.45, ease: "sine.inOut" }, 6.4);
        tl.to(q(".reqs-card"), { opacity: 0.82, duration: 0.4, ease: "sine.inOut" }, 6.1);
        tl.to(q(".reqs-card"), { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 6.5);

        // ======================================================
        // BEAT 3 (7.0 - 9.6s): client signs -> EIP-712 chip; X-PAYMENT header pill forms
        // ======================================================
        // Requirements card slides up & dims to make room
        tl.to(q(".reqs-card"), { y: -8, opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, 7.0);

        tl.to(q(".node-client .node-dot"), { backgroundColor: "#8b6cff", duration: 0.3 }, 7.1);
        tl.add(setStatus("client", "signing"), 7.1);

        // EIP-712 signed chip pops
        tl.to(
          q(".chip-signed"),
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
          7.55,
        );

        // X-PAYMENT header pill forms
        tl.to(
          q(".header-pill"),
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
          8.2,
        );
        tl.add(setStatus("client", "ready"), 8.7);

        // Idle hold (8.9 - 9.7s): signed chip breathes; glow eases up as proof assembles.
        tl.to(q(".chip-signed"), { scale: 1.04, transformOrigin: "left center", duration: 0.45, ease: "sine.inOut" }, 8.95);
        tl.to(q(".chip-signed"), { scale: 1, duration: 0.45, ease: "sine.inOut" }, 9.4);
        tl.to(q(".violet-glow"), { opacity: 0.78, duration: 0.45, ease: "sine.inOut" }, 9.0);
        tl.to(q(".violet-glow"), { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 9.45);

        // ======================================================
        // BEAT 4 (10.0 - 12.8s): packet GET /premium + X-PAYMENT travels client -> server again
        // ======================================================
        // Fade the client-side helper cards so the lane reads clean.
        tl.to(
          [q(".reqs-card"), q(".chip-signed"), q(".header-pill")],
          { opacity: 0, duration: 0.4, ease: "power2.in" },
          10.0,
        );

        // Relabel + widen the packet for the authenticated retry.
        tl.add(setPacketPath("/premium + X-PAYMENT"), 10.25);
        tl.to(q(".node-client .node-dot"), { backgroundColor: "#8b6cff", duration: 0.2 }, 10.25);
        tl.fromTo(
          q(".packet"),
          { x: 480, opacity: 0 },
          { x: 500, opacity: 1, duration: 0.3, ease: "power2.out" },
          10.35,
        );
        tl.fromTo(
          q(".packet"),
          { x: 500 },
          { x: 1090, duration: 1.05, ease: "power2.inOut" },
          10.6,
        );
        tl.to(q(".packet"), { opacity: 0, duration: 0.25, ease: "power2.in" }, 11.65);

        tl.to(q(".node-server .node-dot"), { backgroundColor: "#8b6cff", duration: 0.2 }, 11.72);
        tl.add(setStatus("server", "verifying"), 11.72);

        // Idle hold (12.0 - 12.9s): server breathes while it verifies the proof.
        tl.to(q(".node-server"), { scale: 1.018, transformOrigin: "center center", duration: 0.45, ease: "sine.inOut" }, 12.0);
        tl.to(q(".node-server"), { scale: 1, duration: 0.45, ease: "sine.inOut" }, 12.45);
        tl.to(q(".node-server .node-dot"), { boxShadow: "0 0 14px rgba(139,108,255,0.9)", duration: 0.45, ease: "sine.inOut" }, 12.05);
        tl.to(q(".node-server .node-dot"), { boxShadow: "0 0 0 rgba(139,108,255,0)", duration: 0.45, ease: "sine.inOut" }, 12.5);

        // ======================================================
        // BEAT 5 (13.2 - 16.4s): server -> Casper green pulse; tx chip spinner -> check; settled on-chain
        // ======================================================
        // Green pulse fills the server->casper link.
        tl.fromTo(
          q(".casper-link-fill"),
          { scaleY: 0 },
          { scaleY: 1, duration: 0.8, ease: "power2.inOut" },
          13.2,
        );
        tl.to(q(".node-casper .node-dot"), { boxShadow: "0 0 22px rgba(46,230,166,1)", duration: 0.3 }, 13.9);
        // Casper node pulse
        tl.to(q(".node-casper"), { scale: 1.04, duration: 0.25, ease: "power2.out" }, 14.0);
        tl.to(q(".node-casper"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 14.25);

        // Tx chip appears with spinner
        tl.to(q(".tx-cluster"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.05);
        tl.to(
          q(".tx-spinner"),
          { rotation: 1080, duration: 1.5, ease: "none" },
          14.05,
        );
        // Spinner -> check
        tl.to(q(".tx-spinner"), { opacity: 0, scale: 0.4, duration: 0.25, ease: "power2.in" }, 15.55);
        tl.to(q(".tx-check"), { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 15.65);
        // Confirm pulse on tx chip 1 -> 1.15 -> 1
        tl.to(q(".tx-chip"), { scale: 1.15, duration: 0.2, ease: "power2.out" }, 15.65);
        tl.to(q(".tx-chip"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 15.85);
        tl.add(setStatus("server", "settled"), 15.75);

        // Idle hold (16.1 - 16.9s): Casper node breathes on a confirmed settlement.
        tl.to(q(".node-casper"), { scale: 1.025, transformOrigin: "center center", duration: 0.45, ease: "sine.inOut" }, 16.15);
        tl.to(q(".node-casper"), { scale: 1, duration: 0.45, ease: "sine.inOut" }, 16.6);
        tl.to(q(".casper-link-fill"), { opacity: 0.7, duration: 0.4, ease: "sine.inOut" }, 16.2);
        tl.to(q(".casper-link-fill"), { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 16.6);

        // ======================================================
        // BEAT 6 (16.9 - 19.6s): 200 OK badge travels server -> client; client flips green border + "unlocked"
        // ======================================================
        tl.to(q(".badge-200"), { opacity: 1, duration: 0.25, ease: "back.out(1.4)" }, 16.95);
        tl.fromTo(
          q(".badge-200"),
          { x: 0 },
          { x: -1010, duration: 1.0, ease: "power2.inOut" },
          17.05,
        );
        tl.to(q(".badge-200"), { opacity: 0, duration: 0.25, ease: "power2.in" }, 18.0);

        // Client flips to confirmed
        tl.to(q(".node-client .node-dot"), { backgroundColor: "#2ee6a6", duration: 0.3 }, 17.95);
        tl.to(
          q(".node-client"),
          {
            borderColor: "rgba(46,230,166,0.7)",
            boxShadow: "0 0 0 1px rgba(46,230,166,0.4), 0 24px 60px rgba(0,0,0,0.5)",
            duration: 0.45,
            ease: "power2.out",
          },
          17.95,
        );
        // Client confirm pulse 1 -> 1.15 -> 1
        tl.to(q(".node-client"), { scale: 1.05, duration: 0.22, ease: "power2.out" }, 18.0);
        tl.to(q(".node-client"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 18.22);
        tl.add(setStatus("client", "unlocked", "#2ee6a6"), 18.1);

        // Idle hold (18.7 - 19.8s): client breathes on "unlocked"; glow swells warmly.
        tl.to(q(".node-client"), { scale: 1.02, transformOrigin: "center center", duration: 0.55, ease: "sine.inOut" }, 18.75);
        tl.to(q(".node-client"), { scale: 1, duration: 0.55, ease: "sine.inOut" }, 19.3);
        tl.to(q(".violet-glow"), { opacity: 0.8, duration: 0.55, ease: "sine.inOut" }, 18.8);
        tl.to(q(".violet-glow"), { opacity: 1, duration: 0.55, ease: "sine.inOut" }, 19.35);

        // ======================================================
        // BEAT 7 (20.0 - 22s): gentle hold / breathe, then fade out
        // ======================================================
        // Whole diagram breathes
        tl.to(q(".stage"), { scale: 1.012, transformOrigin: "center center", duration: 0.7, ease: "sine.inOut" }, 20.0);
        tl.to(q(".stage"), { scale: 1, duration: 0.6, ease: "sine.inOut" }, 20.7);

        // Global fade out over last ~0.5s
        tl.to(q(".stage"), { opacity: 0, duration: 0.5, ease: "power2.in" }, 21.5);

        // ---------- Helper: animate the status pill text + color ----------
        function setStatus(which, text, color) {
          const t = gsap.timeline();
          const sel = q('.node-status[data-status="' + which + '"]');
          t.to(sel, {
            opacity: 0,
            duration: 0.12,
            ease: "power1.in",
            onComplete: () => {
              const el = document.querySelector(sel);
              if (el) {
                el.textContent = text;
                if (color) {
                  el.style.color = color;
                  el.style.borderColor = "rgba(46,230,166,0.4)";
                }
              }
            },
          });
          t.to(sel, { opacity: 1, duration: 0.18, ease: "power1.out" });
          return t;
        }

        // ---------- Helper: set the traveling packet's path label (no TextPlugin) ----------
        function setPacketPath(text) {
          const t = gsap.timeline();
          const sel = q(".packet .packet-path");
          t.add(() => {
            const el = document.querySelector(sel);
            if (el) el.textContent = text;
          });
          return t;
        }

        window.__timelines = window.__timelines || {};
        window.__timelines["s2-flow"] = tl;
      })();
    </script>
  </div>
</template>
