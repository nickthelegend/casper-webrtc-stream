<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>casper-webrtc-stream — product promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070a10;
        font-family: "Inter", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      /* cinematic vignette + faint top/bottom grade for premium framing */
      #grade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        background:
          radial-gradient(120% 90% at 50% 50%, transparent 62%, rgba(0, 0, 0, 0.32) 100%);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1 — Intro / wordmark (0–6s) -->
      <div
        id="scene-1"
        class="scene"
        data-composition-id="s1-intro"
        data-composition-src="compositions/s1-intro.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2 — The x402 flow (6–28s) -->
      <div
        id="scene-2"
        class="scene"
        data-composition-id="s2-flow"
        data-composition-src="compositions/s2-flow.html"
        data-start="6"
        data-duration="22"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3 — The code, side by side (28–43s) -->
      <div
        id="scene-3"
        class="scene"
        data-composition-id="s3-code"
        data-composition-src="compositions/s3-code.html"
        data-start="28"
        data-duration="15"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4 — Real, on-chain (43–54s) -->
      <div
        id="scene-4"
        class="scene"
        data-composition-id="s4-proof"
        data-composition-src="compositions/s4-proof.html"
        data-start="43"
        data-duration="11"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 5 — Outro (54–60s) -->
      <div
        id="scene-5"
        class="scene"
        data-composition-id="s5-outro"
        data-composition-src="compositions/s5-outro.html"
        data-start="54"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Cinematic grade overlay (always on) -->
      <div id="grade"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });

      // Subtle breathing on the vignette so the frame feels alive end-to-end.
      mainTl.fromTo(
        "#grade",
        { opacity: 0.78 },
        { opacity: 0.95, duration: 60, ease: "sine.inOut" },
        0,
      );

      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
