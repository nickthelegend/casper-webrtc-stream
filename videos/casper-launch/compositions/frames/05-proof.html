    <style>
      @font-face{font-family:'Space Grotesk';font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
      @font-face{font-family:'Space Grotesk';font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
      @font-face{font-family:'Space Grotesk';font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      #root {

      }

      #root .content {
        position: absolute;
        inset: 0;
        padding: 0 120px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Header — title anchored ~y 200-260 */
      #root .header {

      }

      #root .kicker {
        font-family: "JetBrains Mono", monospace;

      }

      #root .title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 58px;

        letter-spacing: -0.02em;
        margin: 0;
        color: #eaf0f8;
        opacity: 0;
      }

      /* Cards — anchored ~y 380-620 */
      #root .cards {
        display: flex;

        margin-top: 56px;
      }

      #root .card {
        position: relative;
        width: 620px;
        background: #0d121c;
        border: 1px solid rgba(46, 230, 166, 0.25);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);

      }

      #root .card-ring {

        inset: -1px;

      }

      #root .card-top {
        display: flex;

      }

      #root .check-chip {
        width: 52px;
        height: 52px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: rgba(46, 230, 166, 0.14);
        border: 1.5px solid rgba(46, 230, 166, 0.5);
        display: flex;

        position: relative;
      }

      #root .check-mark {
        color: #2ee6a6;

      }

      #root .card-meta {
        display: flex;

      }

      #root .card-status {

      #root .tx-row {
        display: flex;

      #root .tx-label {

      #root .tx-hash {

      }

      #root .card-sub {

      /* Hero stat */
      #root .hero-stat {
        display: flex;

      #root .stat-number,
      #root .stat-count {

      #root .stat-val {

      #root .stat-count-val {
        font-family: "Space Grotesk", sans-serif;

      /* Footer — lowest element kept <= y=860 */

    #root{isolation:isolate;position:relative;}
</style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const ID = '#root';
        const q = (sel) => ID + " " + sel;

        // ---- Count-up helper (deterministic, writes innerText) ----
        function countUp(selector, from, to, decimals, time, dur) {
          const obj = { val: from };
          tl.to(
            obj,
            {
              val: to,
              duration: dur,
              ease: "power2.out",
              onUpdate: () => {
                const el = document.querySelector(ID + " " + selector);
                if (el) el.innerText = obj.val.toFixed(decimals);
              },
            },
            time
          );
        }

        // ---- Initial states ----
        gsap.set(q(".content"), { opacity: 0 });
        gsap.set(q(".kicker"), { y: 24 });
        gsap.set(q(".title"), { y: 30 });
        gsap.set(q(".card-1"), { y: 70 });
        gsap.set(q(".card-2"), { y: 70 });

        // ============================================================
        // BEAT 0 — global content fade in (0 .. 0.4) — hero visible by t<=0.5
        // ============================================================
        tl.to(q(".content"), { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

        // ============================================================
        // BEAT 1 — kicker + title rise in (0.45 .. 1.4)
        // ============================================================
        tl.to(
          q(".kicker"),
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          0.45
        );
        tl.to(
          q(".title"),
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.6
        );

        // ============================================================
        // BEAT 2 — Card 1 slides up + springs, check pops, ring pulse (1.3 .. 2.7)
        // ============================================================
        tl.to(
          q(".card-1"),
          { opacity: 1, y: 0, duration: 0.85, ease: "back.out(1.5)" },
          1.3
        );
        tl.to(
          q(".card-1 .check-mark"),
          { scale: 1, duration: 0.55, ease: "back.out(1.8)" },
          1.9
        );
        // green ring pulse on card 1
        tl.fromTo(
          q(".card-1 .card-ring"),
          { opacity: 0.85, scale: 1 },
          { opacity: 0, scale: 1.04, duration: 0.75, ease: "power2.out" },
          1.95
        );

        // ============================================================
        // BEAT 3 — Card 2 slides up staggered, check pops (2.6 .. 4.0)
        // ============================================================
        tl.to(
          q(".card-2"),
          { opacity: 1, y: 0, duration: 0.85, ease: "back.out(1.5)" },
          2.6
        );
        tl.to(
          q(".card-2 .check-mark"),
          { scale: 1, duration: 0.55, ease: "back.out(1.8)" },
          3.2
        );
        tl.fromTo(
          q(".card-2 .card-ring"),
          { opacity: 0.85, scale: 1 },
          { opacity: 0, scale: 1.04, duration: 0.75, ease: "power2.out" },
          3.25
        );

        // ============================================================
        // BEAT 4 — hero stat counts up 0.00 -> 0.20 + 0 -> 2 (4.0 .. 5.8)
        // ============================================================
        tl.to(
          q(".stat-number"),
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          4.0
        );
        tl.to(
          q(".stat-divider"),
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          4.1
        );
        tl.to(
          q(".stat-count"),
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          4.2
        );
        // gold amount 0.00 -> 0.20
        countUp(".stat-val", 0, 0.2, 2, 4.1, 1.4);
        // settlements 0 -> 2 (integer)
        (function () {
          const obj = { val: 0 };
          tl.to(
            obj,
            {
              val: 2,
              duration: 1.2,
              ease: "power2.out",
              onUpdate: () => {
                const el = document.querySelector(q(".stat-count-val"));
                if (el) el.innerText = Math.round(obj.val).toString();
              },
            },
            4.2
          );
        })();
        // tiny gold pop when amount lands
        tl.fromTo(
          q(".stat-val"),
          { scale: 1 },
          { scale: 1.06, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 },
          5.45
        );

        // ============================================================
        // BEAT 5 — pill + facilitator tag fade in, green confirm glow across cards (5.7 .. 7.6)
        // ============================================================
        tl.to(
          q(".pill"),
          { opacity: 1, duration: 0.55, ease: "back.out(1.5)" },
          5.7
        );
        tl.fromTo(
          q(".pill"),
          { y: 14 },
          { y: 0, duration: 0.55, ease: "back.out(1.5)" },
          5.7
        );
        tl.to(
          q(".facilitator-tag"),
          { opacity: 1, duration: 0.55, ease: "back.out(1.5)" },
          5.9
        );
        tl.fromTo(
          q(".facilitator-tag"),
          { y: 14 },
          { y: 0, duration: 0.55, ease: "back.out(1.5)" },
          5.9
        );
        // "confirmed" green glow pulse across BOTH cards (border + shadow)
        tl.to(
          q(".card"),
          {
            borderColor: "rgba(46,230,166,0.7)",
            boxShadow: "0 24px 60px rgba(0,0,0,0.5), 0 0 46px rgba(46,230,166,0.32)",
            duration: 0.55,
            ease: "power2.out",
            stagger: 0.12,
          },
          6.1
        );
        tl.to(
          q(".card"),
          {
            borderColor: "rgba(46,230,166,0.25)",
            boxShadow: "0 24px 60px rgba(0,0,0,0.5), 0 0 0px rgba(46,230,166,0)",
            duration: 0.85,
            ease: "power2.inOut",
            stagger: 0.12,
          },
          6.75
        );

        // ============================================================
        // BEAT 6 — gentle breathe / hold to the end (7.6 .. 9.8) — NO exit fade
        // ============================================================
        tl.to(
          q(".card-1"),
          { y: -8, duration: 1.1, ease: "sine.inOut" },
          7.6
        );
        tl.to(
          q(".card-1"),
          { y: 0, duration: 1.1, ease: "sine.inOut" },
          8.7
        );
        tl.to(
          q(".card-2"),
          { y: -8, duration: 1.1, ease: "sine.inOut" },
          7.75
        );
        tl.to(
          q(".card-2"),
          { y: 0, duration: 1.1, ease: "sine.inOut" },
          8.85
        );
        // slow breathing on the green glow throughout the hold
        tl.to(
          q(".green-glow"),
          { opacity: 1, duration: 1.1, ease: "sine.inOut" },
          7.6
        );
        tl.to(
          q(".green-glow"),
          { opacity: 0.8, duration: 1.1, ease: "sine.inOut" },
          8.7
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["05-proof"] = tl;
      })();
    </script>
  </div>
</template>
