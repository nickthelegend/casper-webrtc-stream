<template id="01-hook-template">
  <div
    id="root"
    data-composition-id="01-hook"
    data-width="1920"
    data-height="1080"
    data-duration="5.6"
  >
    <!-- Ambient background layers -->
    <div class="bg-base"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Centered lockup (held high above the caption keep-out) -->
    <div class="lockup">
      <div class="mono-wrap">
        <div class="mono-ring"></div>
        <div class="monogram"><span class="mono-num">402</span></div>
      </div>

      <div class="wordmark-wrap">
        <h1 class="wordmark">casper-webrtc-stream</h1>
        <div class="underline"></div>
      </div>

      <div class="kicker">x402 micropayments · settled on Casper</div>
    </div>

    <style>
      @font-face{font-family:'Space Grotesk';font-weight:500;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-500-normal.woff2') format('woff2');}
      @font-face{font-family:'Space Grotesk';font-weight:600;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-600-normal.woff2') format('woff2');}
      @font-face{font-family:'Space Grotesk';font-weight:700;font-display:block;src:url('https://cdn.jsdelivr.net/fontsource/fonts/space-grotesk@latest/latin-700-normal.woff2') format('woff2');}

      #root {
        width: 1920px;
        height: 1080px;
        background-color: #070a10;
        position: relative;
        overflow: hidden;
      }

      #root .bg-base {
        position: absolute;
        inset: 0;
        background-color: #070a10;
      }

      #root .bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(139, 152, 171, 0.05) 1px, transparent 1px);
        background-size: 26px 26px;
      }

      #root .bg-glow {
        position: absolute;
        inset: -10%;
        background: radial-gradient(620px 420px at 18% 14%, rgba(139, 108, 255, 0.18), transparent 60%);
        transform-origin: center center;
        will-change: transform;
      }

      /* Centered lockup: monogram above wordmark, held high (center ~y=470) */
      #root .lockup {
        position: absolute;
        top: 470px;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 1680px;
        text-align: center;
      }

      #root .mono-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin-bottom: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #root .monogram {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b6cff, #5b8cff);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 18px 50px rgba(139, 108, 255, 0.45),
          0 0 90px rgba(139, 108, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
        will-change: transform;
      }

      #root .mono-num {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }

      #root .mono-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 88px;
        height: 88px;
        margin: -44px 0 0 -44px;
        border-radius: 26px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        transform-origin: center center;
        opacity: 0;
        pointer-events: none;
      }

      #root .wordmark-wrap {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }

      #root .wordmark {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 88px;
        line-height: 1.0;
        letter-spacing: -0.02em;
        color: #eaf0f8;
        margin: 0;
        white-space: nowrap;
        /* clip wipe reveal, left-to-right */
        clip-path: inset(0 100% 0 0);
        will-change: clip-path;
      }

      #root .underline {
        margin-top: 26px;
        width: 100%;
        height: 2px;
        background: #8b6cff;
        border-radius: 2px;
        box-shadow: 0 0 14px rgba(139, 108, 255, 0.6);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
      }

      #root .kicker {
        margin-top: 40px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8b98ab;
        opacity: 0;
        will-change: transform, opacity;
      }
    #root{isolation:isolate;position:relative;}
</style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const Q = (s) => '#root ' + s;

        const root = "#root";
        const glow = Q(".bg-glow");
        const lockup = Q(".lockup");
        const monogram = Q(".monogram");
        const ring = Q(".mono-ring");
        const wordmark = Q(".wordmark");
        const underline = Q(".underline");
        const kicker = Q(".kicker");

        // --- Initial states ---
        tl.set(root, { opacity: 0 });
        tl.set(lockup, { y: 14 });
        tl.set(monogram, { scale: 0, rotation: -8 });
        tl.set(ring, { scale: 0.65, opacity: 0 });
        tl.set(wordmark, { clipPath: "inset(0 100% 0 0)", y: 10, opacity: 0 });
        tl.set(underline, { scaleX: 0 });
        tl.set(kicker, { y: 16, opacity: 0 });
        tl.set(glow, { xPercent: 0, yPercent: 0, scale: 1, opacity: 1 });

        // --- Scene fade IN (first ~0.4s) + gentle lockup settle ---
        tl.to(root, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.0);
        tl.to(lockup, { y: 0, duration: 1.2, ease: "power3.out" }, 0.0);

        // --- 1. Monogram springs in (back.out) — hero visible by t<=0.5s ---
        tl.fromTo(
          monogram,
          { scale: 0, rotation: -8 },
          { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" },
          0.12
        );

        // --- Impact ring expands + fades on the monogram landing ---
        tl.fromTo(
          ring,
          { scale: 0.65, opacity: 0.9 },
          { scale: 2.0, opacity: 0, duration: 0.7, ease: "power2.out" },
          0.46
        );

        // --- 2. Wordmark reveals via clip wipe, left-to-right ---
        tl.to(wordmark, { opacity: 1, duration: 0.01 }, 0.9);
        tl.to(
          wordmark,
          { clipPath: "inset(0 0% 0 0)", y: 0, duration: 0.95, ease: "expo.inOut" },
          0.9
        );

        // --- 3. Hairline violet underline draws in (scaleX 0->1, origin left) ---
        tl.to(
          underline,
          { scaleX: 1, duration: 0.85, ease: "power3.out" },
          1.4
        );

        // --- 4. Mono kicker fades up ---
        tl.to(
          kicker,
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          1.8
        );

        // --- 5. Settle: slow continuous drift of the violet glow (full hold) ---
        tl.to(
          glow,
          { xPercent: 7, yPercent: 5, scale: 1.08, duration: 3.7, ease: "sine.inOut" },
          1.6
        );

        // gentle 1.0 -> 1.015 breathing on the monogram during the hold
        tl.to(
          monogram,
          { scale: 1.015, duration: 1.7, ease: "sine.inOut" },
          2.4
        );
        tl.to(
          monogram,
          { scale: 1.0, duration: 1.5, ease: "sine.inOut" },
          4.1
        );

        // NO exit tween — the framework owns the transition out.

        window.__timelines = window.__timelines || {};
        window.__timelines["01-hook"] = tl;
      })();
    </script>
  </div>
</template>
