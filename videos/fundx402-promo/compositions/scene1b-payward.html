    <script>
      (function () {
        const q = (s) => '[data-composition-id="scene1b-payward"] ' + s;
        const tl = gsap.timeline({ paused: true });

        tl.to(q(".p-grid"), { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.1);
        tl.to(q(".p-glow"), { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.1);
        // "So we built Payward"
        tl.fromTo(q(".p-kick"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.fromTo(q(".p-hero"), { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.6);
        // "the credit and settlement layer..."
        tl.fromTo(q(".p-tag"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.6);
        // "Fund402 fronts payments as credit" (~7s)
        tl.fromTo(q(".l-fund"), { opacity: 0, y: 16, x: -10 }, { opacity: 1, y: 0, x: 0, duration: 0.55, ease: "power3.out" }, 6.8);
        tl.fromTo(q(".p-plus"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.4);
        // "and Clawback settles them..." (~10.5s)
        tl.fromTo(q(".l-claw"), { opacity: 0, y: 16, x: 10 }, { opacity: 1, y: 0, x: 0, duration: 0.55, ease: "power3.out" }, 10.4);
        // gentle hold glow on the wordmark
        tl.fromTo(q(".p-hero"), { filter: "brightness(1)" }, { filter: "brightness(1.2)", duration: 1.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, 12.2);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1b-payward"] = tl;
