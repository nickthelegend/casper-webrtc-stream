<!--
  Fund402 promo — caption skin (dark-on-teal karaoke). Active word = near-black text on a
  teal (#25d3a6) block (never white-on-accent). Literal colors + !important so the active
  word beats captions.mjs's appended default (.is-active{color:var(--cap-ink)} = light).
  Reserved holes (kept): <style data-brand-tokens>, var GROUPS=[], var DURATION=0, the 0
  duration/width/height. Hooks: .caption-group/.caption-word + .is-active/.is-spoken.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style data-brand-tokens></style>

<style>
  #captions-root { position: absolute; inset: 0; pointer-events: none; }
  .caption-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 908px);
    height: var(--cap-band-height, 168px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 80%;
    padding: 16px 28px 18px;
    background: rgba(8, 9, 12, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 15px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.16em 0.26em;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 4.2vw, 50px);
    line-height: 1.26;
    letter-spacing: -0.01em;
  }
  /* upcoming — muted off-white, no block */
  .caption-word {
    display: inline-block;
    padding: 0.02em 0.26em 0.08em;
    border-radius: 8px;
    color: #9a9fb0;
    background: transparent;
  }
  /* current — near-black on the teal block (dark-on-accent). !important beats the
     appended default (.is-active{color:var(--cap-ink)}). */
  .caption-word.is-active {
    color: #04150f !important;
    background: #25d3a6 !important;
    box-shadow: 0 0 0 0.05em #25d3a6 !important;
  }
  /* spoken — full off-white, block cleared */
  .caption-word.is-spoken {
    color: #f4f5f7 !important;
    background: transparent !important;
    box-shadow: none !important;
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.16, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
